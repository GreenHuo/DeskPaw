name: Windows application
on:
  workflow_dispatch:
  push:
    branches: ['build/windows-*', 'codex/windows-*']
    tags: ['v*']
  pull_request:
    paths: ['deskpaw/**', 'tests/**', 'packaging/**', 'scripts/build-windows.ps1', '.github/workflows/windows.yml', 'requirements.txt', 'pyproject.toml']
permissions:
  contents: read
jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
      - name: Test and package Windows application and installer
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: DeskPaw-Installer-x64
          path: dist/DeskPaw-Setup-x64.exe
          if-no-files-found: error
      - name: Upload portable Windows application
        uses: actions/upload-artifact@v7
        with:
          name: DeskPaw-Portable-x64
          path: dist/DeskPaw-Windows-x64.zip
          if-no-files-found: error
      - name: Upload Windows verification reports
        uses: actions/upload-artifact@v7
        with:
          name: DeskPaw-Windows-verification
          path: |
            dist/windows-self-test.json
            dist/windows-installer-self-test.json
          if-no-files-found: error
