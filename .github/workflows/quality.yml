name: Code quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - name: Install project and development tools
        run: python -m pip install '.[dev]'
      - name: Check code conventions
        run: |
          ruff check deskpaw tests scripts packaging
          ruff format --check deskpaw tests scripts packaging
      - name: Run offline regression tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
