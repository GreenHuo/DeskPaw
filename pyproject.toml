[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deskpaw"
dynamic = ["version", "dependencies"]
description = "A desktop corgi companion with AI chat and MCP tools"
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["ruff==0.17.0"]

[project.gui-scripts]
deskpaw = "deskpaw.__main__:main"

[project.scripts]
deskpaw-excel-mcp = "deskpaw.integrations.excel.server:main"

[tool.setuptools.dynamic]
version = {attr = "deskpaw.__version__"}
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["deskpaw*"]
namespaces = false

[tool.setuptools.package-data]
deskpaw = ["assets/*.png", "assets/*.svg", "assets/*.ico"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv-win"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/check-macos-perch.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
